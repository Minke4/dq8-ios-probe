name: iOS Probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Build the iOS host shell"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    name: Runtime cross-build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the probe tree
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Toolchain
        run: |
          set -x
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -1
          which ninja || brew install ninja
          brew install glslang spirv-cross 2>/dev/null || true
          which glslangValidator spirv-cross

      - name: Check out SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.16
          path: build/SDL
          persist-credentials: false

      - name: Build SDL3 static libraries for iOS
        run: |
          set -euo pipefail
          cmake -S build/SDL -B build/sdl-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF \
            -DSDL_STATIC=ON -DSDL_SHARED=ON -DSDL_FRAMEWORK=OFF
          cmake --build build/sdl-ios
          cmake --install build/sdl-ios --prefix "$RUNNER_TEMP/sdl-ios"

      - name: Configure DQ8 for iOS
        run: |
          set -euo pipefail
          cmake -S . -B build/ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl-ios" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DDQ8_BUILD_PS2RECOMP=ON \
            -DDQ8_LINK_GENERATED=OFF \
            -DDQ8_GFX_ENABLE_SDLGPU=ON \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_RECOMP=OFF \
            -DPS2X_BUILD_ANALYZER=OFF \
            -DPS2X_BUILD_RUNTIME=ON \
            -DPS2X_ENABLE_FFMPEG=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF \
            -DPS2X_ENABLE_SCCACHE=OFF \
            -DIOS_PROBE=ON \
            2>&1 | tee "$RUNNER_TEMP/configure.log"

      - name: Build runtime stub
        run: |
          set +e
          cmake --build build/ios --target dq8 2>&1 | tee "$RUNNER_TEMP/stub.log"
          echo "stub rc=${PIPESTATUS[0]}"

      - name: Build SDL3 GPU graphics tree
        run: |
          set +e
          cmake --build build/ios --target dq8_gfx_sdlgpu 2>&1 | tee "$RUNNER_TEMP/gfx.log"
          echo "gfx rc=${PIPESTATUS[0]}"

      - name: Build the iOS host shell
        if: ${{ inputs.host }}
        run: |
          set +e
          cmake --build build/ios --target dq8-ios 2>&1 | tee "$RUNNER_TEMP/host.log"
          echo "host rc=${PIPESTATUS[0]}"
          echo "### iOS host build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|Undefined symbols|ld: " "$RUNNER_TEMP/host.log" | head -40 >> "$GITHUB_STEP_SUMMARY" || echo none >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect binaries
        if: always()
        run: |
          for b in build/ios/src/runtime/dq8.app/dq8 build/ios/iosprobe/DQ8Probe.app/DQ8Probe; do
            [ -f "$b" ] || continue
            echo "=== $b"
            file "$b"
            xcrun lipo -info "$b" || true
            xcrun otool -l "$b" | grep -A3 LC_BUILD_VERSION | head -5 || true
            xcrun otool -L "$b" | head -12
          done

      - name: Verify the app bundle
        if: always()
        run: |
          APP=build/ios/iosprobe/DQ8Probe.app
          [ -d "$APP" ] || { echo "no host app"; exit 0; }
          echo "--- bundle contents"; ls -la "$APP"
          echo "--- Info.plist"; plutil -p "$APP/Info.plist" || true
          echo "--- signature"; codesign -dvv "$APP" 2>&1 | head -5 || echo "unsigned (expected)"
          echo "--- SDL_RunApp wiring"
          xcrun nm "$APP/DQ8Probe" | grep -i "UIApplicationMain\|SDL_RunApp" | head -5 || true

      - name: Pack unsigned IPA
        if: always()
        run: |
          set -euo pipefail
          APP=build/ios/iosprobe/DQ8Probe.app
          if [ ! -d "$APP" ]; then echo "no host app produced"; exit 0; fi
          rm -rf "$RUNNER_TEMP/Payload"; mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry DQ8Probe-unsigned.ipa Payload )
          ls -l "$RUNNER_TEMP/DQ8Probe-unsigned.ipa"
          echo "ipa sha256: $(shasum -a 256 "$RUNNER_TEMP/DQ8Probe-unsigned.ipa" | cut -d' ' -f1)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/DQ8Probe-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14
