name: iOS Probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Build the iOS host shells"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    name: Runtime cross-build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the probe tree
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Toolchain
        run: |
          set -x
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -1
          which ninja || brew install ninja
          brew install glslang spirv-cross 2>/dev/null || true

      - name: Check out SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.16
          path: build/SDL
          persist-credentials: false

      - name: Build SDL3 for iOS
        run: |
          set -euo pipefail
          cmake -S build/SDL -B build/sdl-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF -DSDL_FRAMEWORK=OFF
          cmake --build build/sdl-ios
          cmake --install build/sdl-ios --prefix "$RUNNER_TEMP/sdl-ios"
          echo "--- installed targets"
          ls "$RUNNER_TEMP/sdl-ios/lib"
          grep -h "add_library(SDL3::" "$RUNNER_TEMP/sdl-ios/lib/cmake/SDL3/"*.cmake | head -10

      - name: Configure DQ8 for iOS
        run: |
          set -euo pipefail
          cmake -S . -B build/ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl-ios" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DDQ8_BUILD_PS2RECOMP=ON \
            -DDQ8_LINK_GENERATED=OFF \
            -DDQ8_GFX_ENABLE_SDLGPU=ON \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_RECOMP=OFF \
            -DPS2X_BUILD_ANALYZER=OFF \
            -DPS2X_BUILD_RUNTIME=ON \
            -DPS2X_ENABLE_FFMPEG=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF \
            -DPS2X_ENABLE_SCCACHE=OFF \
            -DIOS_PROBE=ON \
            2>&1 | tee "$RUNNER_TEMP/configure.log"
          grep -E "iosprobe:" "$RUNNER_TEMP/configure.log" || true

      - name: Build runtime stub
        run: |
          set +e
          cmake --build build/ios --target dq8 2>&1 | tee "$RUNNER_TEMP/stub.log"
          echo "stub rc=${PIPESTATUS[0]}"

      - name: Build SDL3 GPU graphics tree
        run: |
          set +e
          cmake --build build/ios --target dq8_gfx_sdlgpu 2>&1 | tee "$RUNNER_TEMP/gfx.log"
          echo "gfx rc=${PIPESTATUS[0]}"

      - name: Build the bare SDL3 probe
        if: ${{ inputs.host }}
        run: |
          set +e
          cmake --build build/ios --target dq8-ios-minimal 2>&1 | tee "$RUNNER_TEMP/minimal.log"
          echo "minimal rc=${PIPESTATUS[0]}"

      - name: Build the full probe host
        if: ${{ inputs.host }}
        run: |
          set +e
          cmake --build build/ios --target dq8-ios 2>&1 | tee "$RUNNER_TEMP/host.log"
          echo "host rc=${PIPESTATUS[0]}"
          echo "### iOS host build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|Undefined symbols|ld: " "$RUNNER_TEMP/host.log" | head -30 >> "$GITHUB_STEP_SUMMARY" || echo none >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect binaries and dylib closure
        if: always()
        run: |
          set +e
          echo "### Binary inspection" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for b in build/ios/iosprobe/DQ8Minimal.app/DQ8Minimal build/ios/iosprobe/DQ8Probe.app/DQ8Probe; do
            [ -f "$b" ] || continue
            echo "=== $b"
            xcrun lipo -info "$b"
            xcrun otool -l "$b" | grep -A3 LC_BUILD_VERSION | head -4
            echo "-- linked libraries (must be /System or /usr/lib only)"
            xcrun otool -L "$b"
            echo "-- ObjC delegate classes present?"
            xcrun nm "$b" | grep -c "SDLUIKitSceneDelegate"
            echo "-- SDL_RunApp"
            xcrun nm -u "$b" | grep -c "SDL_RunApp"
            echo
          done >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app bundles
        if: always()
        run: |
          for APP in build/ios/iosprobe/DQ8Minimal.app build/ios/iosprobe/DQ8Probe.app; do
            [ -d "$APP" ] || { echo "missing $APP"; continue; }
            echo "=== $APP"
            ls -la "$APP"
            plutil -p "$APP/Info.plist" | head -20
            codesign -dvv "$APP" 2>&1 | head -3 || echo "unsigned (expected)"
          done

      - name: Pack IPAs
        if: always()
        run: |
          set +e
          echo "--- tree"
          ls -la build/ios/iosprobe || true
          for pair in "DQ8Minimal:build/ios/iosprobe/DQ8Minimal.app:DQ8Minimal" "DQ8Probe:build/ios/iosprobe/DQ8Probe.app:DQ8Probe"; do
            name=$(echo "$pair" | cut -d: -f1)
            app=$(echo "$pair" | cut -d: -f2)
            exe=$(echo "$pair" | cut -d: -f3)
            if [ ! -f "$app/$exe" ]; then echo "skip $name (no $exe)"; continue; fi
            rm -rf "$RUNNER_TEMP/Payload-$name"
            mkdir -p "$RUNNER_TEMP/Payload-$name"
            cp -R "$app" "$RUNNER_TEMP/Payload-$name/"
            # iSH-style shells resolve relative paths oddly; stay absolute.
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/Payload-$name/Payload" "$RUNNER_TEMP/$name-unsigned.ipa"
            echo "== $name"
            ls -l "$RUNNER_TEMP/$name-unsigned.ipa"
            shasum -a 256 "$RUNNER_TEMP/$name-unsigned.ipa"
          done
          true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14
